<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <!-- Student Form -->
        <div class="form-container">

            <input type="hidden" id="studentId">

            <input type="text" id="name" placeholder="Student Name">
            <small id="nameError" class="error"></small>

            <input type="email" id="email" placeholder="Email">
            <small id="emailError" class="error"></small>

            <input type="text" id="department" placeholder="Department">
            <small id="departmentError" class="error"></small>

            <input type="text" id="phone" placeholder="Phone" maxlength="10">
            <small id="phoneError" class="error"></small>

            <input type="number" id="year" placeholder="Year" min="1" max="4">
            <small id="yearError" class="error"></small>

            <button onclick="saveStudent()">Save Student</button>

        </div>

        <!-- Search -->
        <h2>Student List</h2>

        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, email or department..."
                onkeyup="searchStudents()"
            >

        </div>

        <!-- Student Table -->
        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Phone</th>
                    <th>Year</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>

</html>
